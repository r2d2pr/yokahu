[package]
name = "qwen-local"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "qwen-mcp"
path = "src/bin/qwen-mcp.rs"

[[bin]]
name = "yokahu-ui"
path = "src/bin/yokahu-ui.rs"

[profile.release]
opt-level = 3
lto = true
strip = true

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
