[package]
name = "yokahu"
version = "0.3.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "yokahu-mcp"
path = "src/bin/yokahu-mcp.rs"

[[bin]]
name = "yokahu-ui"
path = "src/bin/yokahu-ui.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
strip = true
